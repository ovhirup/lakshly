name: apple

on:
  pull_request:
    paths:
      - "apps/apple/**"
      - "packages/shared/**"
      - "docs/themes.json"
      - "demo-data/sample.synthetic.json"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "packages/shared/**"
      - "docs/themes.json"
      - "demo-data/sample.synthetic.json"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }} unit tests
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            scheme: Lakshly-iOS
            target: LakshlyTests
            destination: "platform=iOS Simulator,name=iPhone 17,OS=26.2"
          - platform: macos
            scheme: Lakshly-macOS
            target: LakshlyMacTests
            destination: "platform=macOS,arch=arm64"
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned Xcode and simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Required Xcode directory is missing: $DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version
          if [ '${{ matrix.platform }}' = 'ios' ]; then
            xcrun simctl list runtimes --json > "$RUNNER_TEMP/lakshly-runtimes.json"
            python3 - "$RUNNER_TEMP/lakshly-runtimes.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              runtimes = json.load(source)["runtimes"]
          if not any(runtime.get("isAvailable") and runtime.get("name") == "iOS 26.2" for runtime in runtimes):
              sys.exit("::error::Required iOS 26.2 simulator runtime is unavailable; no runtime will be downloaded or substituted.")
          PY
          fi
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/apple/Lakshly.xcodeproj \
            -scheme '${{ matrix.scheme }}' \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/lakshly-${{ matrix.platform }}-derived" \
            -resultBundlePath "$RUNNER_TEMP/lakshly-${{ matrix.platform }}.xcresult" \
            -only-testing:'${{ matrix.target }}' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakshly-${{ matrix.platform }}-xcresult
          path: ${{ runner.temp }}/lakshly-${{ matrix.platform }}.xcresult
          retention-days: 7
          if-no-files-found: warn
