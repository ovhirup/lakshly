name: web

on:
  pull_request:
    paths:
      - "workers/feedback/**"
      - "apps/web/**"
      - "demo-data/**"
      - "packages/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "workers/feedback/**"
      - "apps/web/**"
      - "demo-data/**"
      - "packages/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  parsers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/parsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/parsers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Install parser fixture dependencies
        working-directory: packages/parsers
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Install parser fixture dependencies
        working-directory: packages/parsers
        run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  feedback-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/feedback/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
