name: 🐞 Bug report
description: Something isn't working as expected
labels: ["bug", "status: received"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Lakshly better! 💛
        **Please never include real account numbers, statements, amounts or personal data.** Use demo data or redact screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iOS, macOS, Web, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App / OS version
      placeholder: "e.g. Lakshly 0.1.0, iOS 26.1"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes:
      label: Plan
      options: [Free, Premium, Not applicable]
  - type: textarea
    id: environment
    attributes:
      label: Environment (filled in by the app)
      description: App version, platform, theme and tier only. No personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this report contains no real financial or personal data.
          required: true
