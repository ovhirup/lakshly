name: Lakshly
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Lakshly
    LAKSHLY_APP_GROUP: group.app.lakshly.shared
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Lakshly-iOS:
    type: application
    platform: iOS
    sources:
      - path: Lakshly
        excludes: [Resources/Info.plist, Resources/Lakshly.entitlements, Resources/Lakshly-iOS.entitlements]
      - path: ../web/content/roadmap.json
        buildPhase: resources
      - path: ../../demo-data/sample.synthetic.json
        buildPhase: resources
      - path: ../../packages/shared/setup/sources.catalog.json
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__/state.midway.json
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__/dataset.after-import.json
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/nsdl-cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cdsl-cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cdsl-cas-locked.synthetic.pdf
        buildPhase: resources
    dependencies:
      - target: LakshlyGlance
        embed: false
        link: true
      - target: LakshlyWidgets-iOS
        embed: true
        codeSign: false
    postBuildScripts:
      - name: Strip synthetic statement PDFs from Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name '*.synthetic.pdf' -delete
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name 'state.midway.json' -delete
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name 'dataset.after-import.json' -delete
          fi
      - name: Mark iOS Live Activities support
        basedOnDependencyAnalysis: false
        script: |
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" \
            || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Lakshly/Resources/Lakshly-iOS.entitlements
        INFOPLIST_FILE: Lakshly/Resources/Info.plist
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-MonochromeGold AppIcon-Graphite AppIcon-Ocean AppIcon-Forest AppIcon-RoseQuartz"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: hdfc-bank.synthetic.pdf hdfc-bank-locked.synthetic.pdf cas.synthetic.pdf cas-locked.synthetic.pdf nsdl-cas.synthetic.pdf cdsl-cas.synthetic.pdf cdsl-cas-locked.synthetic.pdf state.midway.json dataset.after-import.json
  Lakshly-macOS:
    type: application
    platform: macOS
    sources:
      - path: Lakshly
        excludes: [Resources/Info.plist, Resources/Lakshly.entitlements, Resources/Lakshly-iOS.entitlements]
      - path: ../web/content/roadmap.json
        buildPhase: resources
      - path: ../../demo-data/sample.synthetic.json
        buildPhase: resources
      - path: ../../packages/shared/setup/sources.catalog.json
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__/state.midway.json
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__/dataset.after-import.json
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/nsdl-cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cdsl-cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cdsl-cas-locked.synthetic.pdf
        buildPhase: resources
    postBuildScripts:
      - name: Strip synthetic statement PDFs from Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name '*.synthetic.pdf' -delete
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name 'state.midway.json' -delete
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name 'dataset.after-import.json' -delete
          fi
    dependencies:
      - target: LakshlyWidgets-macOS
        embed: true
        codeSign: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Lakshly/Resources/Lakshly.entitlements
        INFOPLIST_FILE: Lakshly/Resources/Info.plist
        ENABLE_APP_SANDBOX: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: hdfc-bank.synthetic.pdf hdfc-bank-locked.synthetic.pdf cas.synthetic.pdf cas-locked.synthetic.pdf nsdl-cas.synthetic.pdf cdsl-cas.synthetic.pdf cdsl-cas-locked.synthetic.pdf state.midway.json dataset.after-import.json
  LakshlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LakshlyTests
        excludes:
          - "Fixtures/**"
      - path: LakshlyTests/Fixtures/Parsers
        type: folder
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__
        type: folder
        buildPhase: resources
      - path: ../../packages/shared/money/__fixtures__/format-parity.json
        buildPhase: resources
      - path: ../../docs/themes.json
        buildPhase: resources
      - path: StoreKit/Lakshly.storekit
        buildPhase: resources
      - path: StoreKit/Lakshly-US.storekit
        buildPhase: resources
    dependencies:
      - target: Lakshly-iOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_NAME: LakshlyTests
        PRODUCT_MODULE_NAME: LakshlyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lakshly.app/Lakshly"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
  LakshlyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LakshlyTests
        excludes:
          - "Fixtures/**"
          - "ThemeAppIconTests.swift"
      - path: LakshlyTests/Fixtures/Parsers
        type: folder
        buildPhase: resources
      - path: ../../packages/shared/setup/__fixtures__
        type: folder
        buildPhase: resources
      - path: ../../packages/shared/money/__fixtures__/format-parity.json
        buildPhase: resources
      - path: ../../docs/themes.json
        buildPhase: resources
      - path: StoreKit/Lakshly.storekit
        buildPhase: resources
      - path: StoreKit/Lakshly-US.storekit
        buildPhase: resources
    dependencies:
      - target: Lakshly-macOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_NAME: LakshlyMacTests
        PRODUCT_MODULE_NAME: LakshlyMacTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lakshly.app/Contents/MacOS/Lakshly"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.macostests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
  LakshlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LakshlyUITests
      - path: StoreKit/Lakshly.storekit
        buildPhase: resources
      - path: StoreKit/Lakshly-US.storekit
        buildPhase: resources
    dependencies:
      - target: Lakshly-iOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_NAME: LakshlyUITests
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_TARGET_NAME: Lakshly-iOS
  LakshlyMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: LakshlyUITests/SyntheticSmokeUITests.swift
    dependencies:
      - target: Lakshly-macOS
    settings:
      base:
        PRODUCT_NAME: LakshlyMacUITests
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.macuitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_TARGET_NAME: Lakshly-macOS
  LakshlyGlance:
    type: framework
    platform: iOS
    sources:
      - path: LakshlyGlance
    settings:
      base:
        PRODUCT_NAME: LakshlyGlance
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.glance
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  LakshlyWidgets-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: LakshlyWidgets
        excludes:
          - Info.plist
          - iOS.entitlements
          - macOS.entitlements
      - path: Lakshly/Glance/GlanceSnapshot.swift
      - path: Lakshly/Glance/GlanceBuilder.swift
      - path: Lakshly/Glance/GlanceStore.swift
      - path: Lakshly/Glance/GlanceLinks.swift
      - path: Lakshly/Glance/GlanceViews.swift
      - path: Lakshly/Glance/LiveActivityViews.swift
      - path: Lakshly/Components/Theme.swift
      - path: Lakshly/Components/ThemeDefinitions.swift
      - path: Lakshly/Components/Money.swift
      - path: Lakshly/Components/Currency.swift
      - path: Lakshly/Components/Currencies.gen.swift
      - path: Lakshly/Models/Profile.swift
      - path: Lakshly/Models/Dataset.swift
      - path: Lakshly/Setup/SetupState.swift
      - path: Lakshly/Setup/SetupLinks.swift
      - path: Lakshly/Setup/SourcesCatalog.swift
      - path: Lakshly/Setup/SetupSuggest.swift
      - path: Lakshly/Store/Entitlements.swift
    dependencies:
      - target: LakshlyGlance
        embed: false
        link: true
    settings:
      base:
        PRODUCT_NAME: LakshlyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LakshlyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LakshlyWidgets/iOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LakshlyWidgets-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: LakshlyWidgets
        excludes:
          - Info.plist
          - iOS.entitlements
          - macOS.entitlements
      - path: Lakshly/Glance/GlanceSnapshot.swift
      - path: Lakshly/Glance/GlanceBuilder.swift
      - path: Lakshly/Glance/GlanceStore.swift
      - path: Lakshly/Glance/GlanceLinks.swift
      - path: Lakshly/Glance/GlanceViews.swift
      - path: Lakshly/Glance/LiveActivityViews.swift
      - path: Lakshly/Components/Theme.swift
      - path: Lakshly/Components/ThemeDefinitions.swift
      - path: Lakshly/Components/Money.swift
      - path: Lakshly/Components/Currency.swift
      - path: Lakshly/Components/Currencies.gen.swift
      - path: Lakshly/Models/Profile.swift
      - path: Lakshly/Models/Dataset.swift
      - path: Lakshly/Setup/SetupState.swift
      - path: Lakshly/Setup/SetupLinks.swift
      - path: Lakshly/Setup/SourcesCatalog.swift
      - path: Lakshly/Setup/SetupSuggest.swift
      - path: Lakshly/Store/Entitlements.swift
    settings:
      base:
        PRODUCT_NAME: LakshlyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LakshlyWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: LakshlyWidgets/macOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  Lakshly-iOS:
    build:
      targets:
        Lakshly-iOS: all
        LakshlyGlance: all
        LakshlyWidgets-iOS: all
        LakshlyUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Lakshly.storekit
    test:
      config: Debug
      # Same local configuration as the Debug run action, so xcodebuild enables
      # StoreKit testing. The file is not copied into the app bundle.
      storeKitConfiguration: StoreKit/Lakshly.storekit
      environmentVariables:
        - variable: LAKSHLY_SHOTS_DIR
          value: $(LAKSHLY_SHOTS_DIR)
          isEnabled: true
      targets:
        - name: LakshlyTests
          parallelizable: false
        - name: LakshlyUITests
          parallelizable: false
  Lakshly-macOS:
    build:
      targets:
        Lakshly-macOS: all
        LakshlyWidgets-macOS: all
        LakshlyMacTests: [test]
        LakshlyMacUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Lakshly.storekit
    test:
      config: Debug
      storeKitConfiguration: StoreKit/Lakshly.storekit
      targets:
        - name: LakshlyMacTests
          parallelizable: false
        - name: LakshlyMacUITests
          parallelizable: false
