name: Lakshly
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: Lakshly/Resources/Info.plist
    PRODUCT_NAME: Lakshly
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Lakshly-iOS:
    type: application
    platform: iOS
    sources:
      - path: Lakshly
        excludes: [Resources/Info.plist, Resources/Lakshly.entitlements]
      - path: ../../demo-data/sample.synthetic.json
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas-locked.synthetic.pdf
        buildPhase: resources
    postBuildScripts:
      - name: Strip synthetic statement PDFs from Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name '*.synthetic.pdf' -delete
          fi
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: hdfc-bank.synthetic.pdf hdfc-bank-locked.synthetic.pdf cas.synthetic.pdf cas-locked.synthetic.pdf
  Lakshly-macOS:
    type: application
    platform: macOS
    sources:
      - path: Lakshly
        excludes: [Resources/Info.plist, Resources/Lakshly.entitlements]
      - path: ../../demo-data/sample.synthetic.json
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/hdfc-bank-locked.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas.synthetic.pdf
        buildPhase: resources
      - path: LakshlyTests/Fixtures/Parsers/cas-locked.synthetic.pdf
        buildPhase: resources
    postBuildScripts:
      - name: Strip synthetic statement PDFs from Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            find "$TARGET_BUILD_DIR/$WRAPPER_NAME" -name '*.synthetic.pdf' -delete
          fi
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Lakshly/Resources/Lakshly.entitlements
        ENABLE_APP_SANDBOX: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: hdfc-bank.synthetic.pdf hdfc-bank-locked.synthetic.pdf cas.synthetic.pdf cas-locked.synthetic.pdf
  LakshlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LakshlyTests
        excludes:
          - "Fixtures/**"
      - path: LakshlyTests/Fixtures/Parsers
        type: folder
        buildPhase: resources
      - path: ../../docs/themes.json
        buildPhase: resources
      - path: StoreKit/Lakshly.storekit
        buildPhase: resources
      - path: StoreKit/Lakshly-US.storekit
        buildPhase: resources
    dependencies:
      - target: Lakshly-iOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_NAME: LakshlyTests
        PRODUCT_MODULE_NAME: LakshlyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lakshly.app/Lakshly"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
  LakshlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LakshlyUITests
      - path: StoreKit/Lakshly.storekit
        buildPhase: resources
      - path: StoreKit/Lakshly-US.storekit
        buildPhase: resources
    dependencies:
      - target: Lakshly-iOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_NAME: LakshlyUITests
        PRODUCT_BUNDLE_IDENTIFIER: app.lakshly.Lakshly.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_TARGET_NAME: Lakshly-iOS
schemes:
  Lakshly-iOS:
    build:
      targets:
        Lakshly-iOS: all
        LakshlyUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Lakshly.storekit
    test:
      config: Debug
      # Same local configuration as the Debug run action, so xcodebuild enables
      # StoreKit testing. The file is not copied into the app bundle.
      storeKitConfiguration: StoreKit/Lakshly.storekit
      targets:
        - name: LakshlyTests
          parallelizable: false
        - name: LakshlyUITests
          parallelizable: false
  Lakshly-macOS:
    build:
      targets:
        Lakshly-macOS: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Lakshly.storekit
